          description: ''
      summary: Obtener lista de reservas
      parameters:
      - name: labId
        in: query
        required: false
        schema:
          type: string
        example: 1
      - name: fecha
        in: query
        required: false
        schema:
          type: string
        example: '2026-08-08'
      - name: userId
        in: query
        required: false
        schema:
          type: string
        example: 1
