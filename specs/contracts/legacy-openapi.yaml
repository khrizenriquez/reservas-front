  /api/labs/disponibles/:
    get:
      operationId: labs_disponibles_retrieve
      description: |-
        Como docente, quiero consultar los laboratorios disponibles filtrando por
        fecha y horario, para elegir el espacio adecuado antes de registrar mi
        reserva.

        GET /api/labs/disponibles/?fecha=YYYY-MM-DD&hora_inicio=HH:MM&hora_fin=HH:MM
      tags:
      - labs
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lab'
          description: ''
      summary: Obtener labs disponibles
      parameters:
      - name: fecha
        in: query
        required: false
        schema:
          type: string
        example: '2026-08-08'
      - name: hora_inicio
        in: query
        required: false
        schema:
          type: string
        example: 08:00:00
      - name: hora_fin
        in: query
        required: false
        schema:
          type: string
        example: 08:00:00
