components:
  schemas:
    CondicionList:
      type: object
      properties:
        UMG_ID:
          type: integer
          readOnly: true
        UMG_Lab_ID:
          type: integer
          readOnly: true
        UMG_Lab_Nombre:
          type: string
          readOnly: true
        UMG_Fecha:
          type: string
          format: date
          readOnly: true
        UMG_Hora_Inicio:
          type: string
          format: time
          readOnly: true
        UMG_Hora_Fin:
          type: string
          format: time
          readOnly: true
        UMG_Tipo:
          type: string
          readOnly: true
        UMG_Motivo:
          type: string
          readOnly: true
        UMG_Estado:
