      operationId: auth_cambiar_contrasena_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioList'
            examples:
              auto-generated:
                summary: Estructura base generada automaticamente
                value:
                  UMG_ID: 1
                  NuevaContrasena: Cambiar123
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UsuarioList'
            examples:
              auto-generated:
                summary: Estructura base generada automaticamente
                value:
                  UMG_ID: 1
                  NuevaContrasena: Cambiar123
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UsuarioList'
            examples:
              auto-generated:
                summary: Estructura base generada automaticamente
                value:
                  UMG_ID: 1
                  NuevaContrasena: Cambiar123
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioList'
          description: ''
      summary: Cambiar contrasena de usuarios
